name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - name: Dependencies match Expo SDK
        run: pnpm exec expo install --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  e2e:
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Visual baselines are rendered and compared inside the Playwright image only, so the
  # pixels never depend on the runner's fonts. A commit whose message contains
  # [update-snapshots] regenerates them and pushes them back to the same branch.
  visual:
    needs: web-build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: write
    env:
      UPDATE: ${{ contains(github.event.head_commit.message, '[update-snapshots]') }}
    steps:
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Compare with baselines
        if: env.UPDATE != 'true'
        run: pnpm e2e:visual
      - name: Update baselines
        if: env.UPDATE == 'true' && github.event_name == 'push'
        run: |
          pnpm e2e:visual:update
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__
          git commit -m 'Update visual baselines' || echo 'Baselines unchanged'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results
          retention-days: 7
